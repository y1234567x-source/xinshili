  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {

      --brand-black: #1A1A1A;
      --brand-black-soft: #2D2D2D;
      --brand-cream: #F5F0E1;
      --brand-cream-warm: #EDE5D0;
      --brand-brown: #8B7355;
      --brand-brown-light: #C4B59A;
      --brand-brown-dark: #5C4A32;
      --text-primary: #1A1A1A;
      --text-secondary: #5C4A32;
      --text-light: #9A8B74;
      --border-color: #E0D8C8;
      --card-bg: #FFFDF7;
      --shadow-soft: 0 2px 16px rgba(26,26,26,0.06);
      --shadow-card: 0 4px 24px rgba(26,26,26,0.08);
    }
    html, body { height: 100%; font-family: 'Noto Sans SC', -apple-system, sans-serif; background: var(--brand-cream); color: var(--text-primary); -webkit-font-smoothing: antialiased; overflow-x: hidden; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

    /* Logo */
    .logo-img { height: 80px; display: block; margin: 0 auto; }

    /* 按钮 */
    .btn { display: block; width: 100%; padding: 16px 24px; border: none; border-radius: 8px; font-size: 17px; font-weight: 700; font-family: 'Noto Sans SC', sans-serif; cursor: pointer; transition: all 0.2s; text-align: center; min-height: 56px; letter-spacing: 0.5px; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--brand-black); color: var(--brand-yellow); box-shadow: 0 4px 16px rgba(26,26,26,0.2); }
    .btn-yellow { background: var(--brand-yellow); color: var(--brand-black); box-shadow: 0 4px 16px rgba(245,230,23,0.3); }
    .btn-outline { background: transparent; color: var(--brand-black); border: 2px solid var(--brand-black); }
    .btn-large { font-size: 19px; padding: 18px 24px; min-height: 64px; border-radius: 10px; }

    /* 输入框 */
    .input { width: 100%; padding: 14px 16px; border: 2px solid var(--border-color); border-radius: 8px; font-size: 16px; font-family: 'Noto Sans SC', sans-serif; background: var(--card-bg); color: var(--text-primary); outline: none; transition: border-color 0.2s; }
    .input:focus { border-color: var(--brand-brown); }
    .input::placeholder { color: var(--text-light); }

    /* 标签 */
    .tag { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; background: var(--brand-yellow-soft); color: var(--brand-black); margin: 0 4px 4px 0; border: 1px solid rgba(245,230,23,0.4); }

    /* 配方行 */
    .formula-row { display: flex; align-items: center; padding: 10px 16px; background: var(--card-bg); border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border-color); gap: 12px; }
    .formula-row-icon { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border-color); }
    .formula-row-name { flex: 1; font-size: 15px; font-weight: 500; color: var(--text-primary); }
    .scent-row-drops { color: var(--brand-brown-dark); font-weight: 700; font-size: 16px; }

    /* 页面头部 */
    .page-header { text-align: center; padding: 0 20px; }
    .page-title { font-family: 'Noto Serif SC', serif; font-size: 26px; font-weight: 900; margin-bottom: 8px; color: var(--text-primary); letter-spacing: 1px; }
    .page-subtitle { font-size: 14px; color: var(--text-secondary); line-height: 1.6; font-weight: 400; }

    /* 内容区 */
    .page-content { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 20px; }
    .page-footer { padding: 20px; margin-top: auto; }

    /* ========== 欢迎页 ========== */
    .welcome-page {
      background: var(--brand-yellow);
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }
    .welcome-page::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
    }
    .welcome-page::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: -40px;
      width: 160px;
      height: 160px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }
    .welcome-logo-wrap {
      width: 120px;
      height: 120px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      animation: gentleFloat 3s ease-in-out infinite;
    }
    .welcome-logo-wrap img { width: 72px; height: 72px; object-fit: contain; }
    .welcome-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 38px;
      font-weight: 900;
      color: var(--brand-black);
      margin-bottom: 8px;
      letter-spacing: 4px;
    }
    .welcome-en {
      font-size: 13px;
      color: var(--brand-black-soft);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 32px;
      opacity: 0.7;
    }
    .welcome-desc {
      font-size: 15px;
      color: var(--brand-black-soft);
      line-height: 1.9;
      margin-bottom: 40px;
      max-width: 320px;
    }
    .welcome-footer {
      font-size: 11px;
      color: var(--brand-black-soft);
      opacity: 0.5;
      margin-top: 28px;
      max-width: 300px;
      line-height: 1.6;
    }

    /* ========== 输入页 ========== */
    .input-page { background: var(--card-bg); padding-top: 48px; }

      border-radius: 12px;

      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 24px;

      height: 80px;
      margin: 0 auto 32px;
      opacity: 0.8;

      content: '';

      width: 40%;
      height: 100%;
      background: var(--brand-yellow);

      margin-bottom: 20px;
      letter-spacing: 1px;

      height: 2px;
      background: var(--brand-yellow);

    .story-diluent {

    .result-footer { padding: 16px 20px 24px; }

      .page-title { font-size: 22px; }

    }

    function parseCustomerWish(customerWish) {

    function scoreScents(scents, parsedIntent, simpleFeelings) {

        if (scent.note === 'middle' && ['温柔','浪漫','甜美'].some(f => simpleFeelings.includes(f))) score += 1;
        if (scent.note === 'base' && ['沉稳','有记忆点','温暖'].some(f => simpleFeelings.includes(f))) score += 1;
        parsedIntent.avoidKeywords.forEach(ak => { const r = AVOID_RULES[ak]; if (r && r.scents.includes(scent.id)) score += r.penalty; });

    function weightedPick(candidates, { excludeIds = [] } = {}) {
      const filtered = candidates.filter(item => !excludeIds.includes(item.scent.id));

      let r = Math.random() * total;
      for (const item of pool) { r -= Math.max(item.score, 1); if (r <= 0) return item.scent; }
      return pool[0].scent;

      if (pairs.length > 0 && Math.random() < 0.7) { const p = pairs[Math.floor(Math.random()*pairs.length)]; return p[0]+['与','和','·'][Math.floor(Math.random()*3)]+p[1]; }

      function dist(sc,tot){const d=[];if(!sc.length)return d;let rem=tot;const b=Math.floor(tot/sc.length);sc.forEach((s,i)=>{let dr=i===sc.length-1?rem:Math.max(b,2);d.push({scentId:s.id,name:s.name,drops:dr,note:s.note});rem-=dr;});return d;}

      const adj = { '清新':['初晴','晓露','青岚','浅风','晨光'],'温柔':['暮云','软风','晚樱','浮光','浅梦'],'明亮':['暖阳','金晖','流光','晴空','朝露'],'安静':['静水','幽兰','空山','暮色','微澜'],'温暖':['暖橘','炉火','余晖','浅冬','春泥'],'自然':['山风','野径','苔痕','松影','竹露'],'甜美':['蜜桃','花蜜','蜜语','甜风','糖露'],'浪漫':['夜樱','月光','星河','绯红','花信'],'祝福':['祈愿','星光','春晓','花开','暖阳'],'自由':['长风','旷野','飞鸟','远帆','云游'],'独特':['孤芳','幽兰','暗香','独白','独行'],'干净':['素雪','白露','清风','素月','浅溪'],'沉稳':['沉木','深林','暮钟','古松','远山'],'优雅':['素兰','清风','雅韵','疏影','淡香'] };
      const main = feelings[0] || '清新';
      const a = (adj[main]||adj['清新'])[Math.floor(Math.random()*5)];
      const p = [];
      if(names[0]){p.push(`${a}·${names[0]}`,`${names[0]}的${a}`);if(names.length>1)p.push(`${names[0]}与${names[1]}`);}
      p.push(`${a}之诗`);
      return p[Math.floor(Math.random()*p.length)];
    }

    function generateStoryCard(data) {
      const { customerWish, simplifiedFeelings, finalFormula, perfumeName } = data;
      let story = `你说："${customerWish || '想要一瓶特别的香水'}"\n\nAI 听懂了，这瓶香水应该是${(simplifiedFeelings||[]).slice(0,3).join('、')}的。\n\n从一句话到一瓶香水，AI 为你和心青年挑选了最适合的味道。\n\n这瓶叫「${perfumeName||'无名的香气'}」的香水，和心青年一起完成独属于你们的香氛记忆。`;
      const lines = ['闻见彼此，也是理解的开始。','香水里没有对错，只有你们一起的选择。','慢下来，等一等，就能一起完成一件事。','每一种味道，都是你们共同的心情翻译。'];
      return { title: perfumeName||'无名的香气', coCreators:'你 × 心青年 × AI', keywords: simplifiedFeelings||['清新','温柔'], formulaByNote:{ top:finalFormula?.formula?.top?.map(i=>`${i.name}：${i.drops}滴`)||[], middle:finalFormula?.formula?.middle?.map(i=>`${i.name}：${i.drops}滴`)||[], base:finalFormula?.formula?.base?.map(i=>`${i.name}：${i.drops}滴`)||[] }, totalDrops:finalFormula?.totalDrops||30, diluentText:'最后请心青年加入稀释液完成制作', story, understandingLine: lines[Math.floor(Math.random()*lines.length)] };
    }

    // ============ App ============
    const STEPS = ['welcome','input','loading','result'];

    function App() {
      const [step, setStep] = useState(0);
      const [state, setState] = useState({ customerWish:'', simplifiedFeelings:[], direction:null, finalFormula:null, perfumeName:'', storyCard:null });
      const updateState = useCallback(u => setState(p => ({...p,...u})), []);
      const goNext = useCallback(() => setStep(s => Math.min(s+1, STEPS.length-1)), []);
      const goToStart = useCallback(() => { setStep(0); setState({customerWish:'',simplifiedFeelings:[],direction:null,finalFormula:null,perfumeName:'',storyCard:null}); }, []);

      const prevRef = React.useRef(-1);
      React.useEffect(() => {
        if (step === 2 && prevRef.current !== 2 && state.customerWish) {
          setTimeout(() => {
            const res = generateDirectionFull(state.customerWish);
            const formula = generateFormula(res.direction);
            const name = generatePerfumeName(res.simpleFeelings, res.direction);
            const storyCard = generateStoryCard({ customerWish:state.customerWish, simplifiedFeelings:res.simpleFeelings, finalFormula:formula, perfumeName:name });
            updateState({ simplifiedFeelings:res.simpleFeelings, direction:res.direction, finalFormula:formula, perfumeName:name, storyCard });
            goNext();
          }, 1200);
        }
        prevRef.current = step;
      }, [step, state.customerWish]);

      const LOGO_SRC = 'assets/sparrow-logo.png';
      const BG_SRC = 'assets/story-bg.jpg';
      const SCENT_IMG_BASE = 'assets/scents/';
      const getScentId = (name) => { const s = SCENTS.find(x => x.name === name); return s ? s.id : name; };

      // ============ 动态水彩风格 SVG 图样生成 ============
      // 分类色板：洗色、主色、细节色、叶色
      const WATERCOLOR_PALETTE = {
        citrus:  { wash1:'#FFF8E0', wash2:'#FDECC8', main:'#F0A020', detail:'#C88010', leaf:'#7CA050' },
        fruity:  { wash1:'#FFF0F0', wash2:'#FFE0E8', main:'#F08090', detail:'#C06070', leaf:'#70A060' },
        floral:  { wash1:'#FFF5F8', wash2:'#FFE8F0', main:'#E090B0', detail:'#B07090', leaf:'#80A870' },
        herbal:  { wash1:'#F0F8F0', wash2:'#E0F0E8', main:'#60B090', detail:'#408060', leaf:'#508848' },
        woody:   { wash1:'#F5F0E5', wash2:'#E8DDD0', main:'#907050', detail:'#604830', leaf:'#6A8858' },
        spicy:   { wash1:'#FFF0E0', wash2:'#FFE0C0', main:'#D08030', detail:'#A06020', leaf:'#809048' },
        sweet:   { wash1:'#FFFAF0', wash2:'#FFF0E0', main:'#D8B880', detail:'#B09060', leaf:'#88A870' },
        tea:     { wash1:'#F5F8F0', wash2:'#E8F0E0', main:'#90B878', detail:'#608850', leaf:'#708840' },
        green:   { wash1:'#F0F8F0', wash2:'#E0F0E0', main:'#68A868', detail:'#408040', leaf:'#508840' },
        aquatic: { wash1:'#F0F8FF', wash2:'#E0F0F8', main:'#60A8C8', detail:'#4080A0', leaf:'#78A888' },
        musk:    { wash1:'#F8F4F0', wash2:'#F0E8E0', main:'#C0B098', detail:'#988870', leaf:'#90A880' },
        amber:   { wash1:'#FFF5E8', wash2:'#FFE8D0', main:'#C89848', detail:'#A07028', leaf:'#889858' }
      };

      // 种子随机数生成器
      function seededRandom(seed) {
        let s = seed;
        return () => { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
      }

      // 字符串哈希
      function hashStr(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
        return Math.abs(h);
      }

      // 生成不规则水彩斑点路径
      function _wcBlob(rng, cx, cy, rx, ry, pts) {
        pts = pts || 10;
        let d = '';
        for (let i = 0; i <= pts; i++) {
          const a = (Math.PI * 2 / pts) * i;
          const jitterX = (rng() - 0.5) * rx * 0.6;
          const jitterY = (rng() - 0.5) * ry * 0.6;
          const x = cx + Math.cos(a) * (rx + jitterX);
          const y = cy + Math.sin(a) * (ry + jitterY);
          d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
        }
        return d + 'Z';
      }

      // 生成叶形路径
      function _leafPath(rx, ry, curve) {
        curve = curve || 0.5;
        return `M0,${-ry} Q${rx * curve},${-ry * 0.4} 0,${ry} Q${-rx * curve},${-ry * 0.4} 0,${-ry}Z`;
      }

      // 生成花瓣路径
      function _petalPath(rx, ry) {
        return `M0,0 Q${rx * 0.8},${-ry * 0.6} 0,${-ry} Q${-rx * 0.8},${-ry * 0.6} 0,0Z`;
      }

      // 主函数：生成水彩风格 SVG
      function generateNoteSVG(noteType, scentNames) {
        const W = 440, H = 140;
        const rng = seededRandom(hashStr(scentNames.join(',') + noteType + Date.now()));
        const scents = scentNames.map(n => SCENTS.find(s => s.name === n)).filter(Boolean);
        const primary = scents[0];
        const cat = primary
          ? (WATERCOLOR_PALETTE[primary.category] || WATERCOLOR_PALETTE.floral)
          : WATERCOLOR_PALETTE.floral;
        const category = primary ? primary.category : 'floral';

        // 滤镜 ID 前缀（避免页面内多个 SVG 冲突）
        const fid = noteType + hashStr(scentNames.join(',')) % 9999;

        // ====== SVG 滤镜定义 ======
        // 水彩边缘滤镜：feTurbulence + feDisplacementMap
        const filterDef = `
      <defs>
        <filter id="wcEdge${fid}" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="3" seed="${Math.floor(rng()*9999)}" result="turb"/>
          <feDisplacementMap in="SourceGraphic" in2="turb" scale="6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <!-- 柔化滤镜 -->
        <filter id="wcSoft${fid}" x="-5%" y="-5%" width="110%" height="110%">
          <feGaussianBlur stdDeviation="1.2"/>
        </filter>
        <!-- 水彩纹理叠加 -->
        <filter id="wcTex${fid}" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" seed="${Math.floor(rng()*9999)}" result="noise"/>
          <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
          <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="textured"/>
        </filter>
      </defs>`;

        // ====== 1. 水彩洗色背景 ======
        let bgElements = '';
        // 奶油色基底
        bgElements += `<rect width="${W}" height="${H}" rx="10" fill="#F5F0E1"/>`;
        // 3-4 个不规则洗色斑块
        const washColors = [cat.wash1, cat.wash2, cat.main, cat.wash1];
        const washCount = 3 + Math.floor(rng() * 2);
        for (let i = 0; i < washCount; i++) {
          const cx = 40 + rng() * (W - 80);
          const cy = 20 + rng() * (H - 40);
          const rx = 80 + rng() * 120;
          const ry = 40 + rng() * 60;
          const opacity = (0.12 + rng() * 0.14).toFixed(2);
          const blob = _wcBlob(rng, cx, cy, rx, ry, 10 + Math.floor(rng() * 5));
          bgElements += `<path d="${blob}" fill="${washColors[i % washColors.length]}" opacity="${opacity}" filter="url(#wcEdge${fid})"/>`;
        }
        // 几个小颜料飞溅
        for (let i = 0; i < 4 + Math.floor(rng() * 4); i++) {
          const sx = 10 + rng() * (W - 20);
          const sy = 5 + rng() * (H - 10);
          const sr = 2 + rng() * 5;
          const blob = _wcBlob(rng, sx, sy, sr, sr * (0.6 + rng() * 0.8), 6);
          bgElements += `<path d="${blob}" fill="${cat.main}" opacity="${(0.08 + rng() * 0.1).toFixed(2)}" filter="url(#wcEdge${fid})"/>`;
        }

        // ====== 2. 主植物插画 ======
        let mainArt = '';
        // 根据分类绘制不同的植物元素
        const isFloral = ['floral', 'tea'].includes(category);
        const isLeafy = ['herbal', 'green'].includes(category);
        const isFruity = ['citrus', 'fruity'].includes(category);
        const isWoody = ['woody', 'spicy', 'amber', 'musk', 'sweet'].includes(category);
        const isAquatic = category === 'aquatic';

        // 花朵绘制辅助
        function drawFlower(cx, cy, size, petalCount, style) {
          let svg = '';
          // 茎
          const stemEndY = cy + size * 2.5 + rng() * 20;
          const stemCurveX = cx + (rng() - 0.5) * 30;
          svg += `<path d="M${cx},${cy + size * 0.3} Q${stemCurveX},${(cy + stemEndY) / 2} ${cx - 5},${stemEndY}" fill="none" stroke="${cat.leaf}" stroke-width="1.5" opacity="0.35" stroke-linecap="round" filter="url(#wcSoft${fid})"/>`;
          // 叶子
          const leafY = cy + size * 1.2 + rng() * 10;
          const leafX = cx + 5 + rng() * 10;
          const leafSize = size * (0.5 + rng() * 0.3);
          const leafRot = 25 + rng() * 30;
          svg += `<path d="${_leafPath(leafSize * 0.5, leafSize, 0.55)}" fill="${cat.leaf}" opacity="0.3" transform="translate(${leafX},${leafY}) rotate(${leafRot})" filter="url(#wcEdge${fid})"/>`;
          // 第二片叶子（可选）
          if (rng() > 0.4) {
            const leaf2Y = leafY + 8 + rng() * 10;
            const leaf2X = cx - 8 - rng() * 8;
            const leaf2Rot = -20 - rng() * 25;
            svg += `<path d="${_leafPath(leafSize * 0.4, leafSize * 0.8, 0.5)}" fill="${cat.leaf}" opacity="0.22" transform="translate(${leaf2X},${leaf2Y}) rotate(${leaf2Rot})" filter="url(#wcEdge${fid})"/>`;
          }
          // 花瓣
          if (style === 'rose') {
            // 玫瑰：3-4 层螺旋花瓣
            const layers = 3 + Math.floor(rng() * 2);
            for (let layer = layers - 1; layer >= 0; layer--) {
              const layerSize = size * (0.4 + layer * 0.25);
              const petals = 4 + layer;
              const layerOpacity = (0.15 + layer * 0.06).toFixed(2);
              const layerColor = layer < 1 ? cat.detail : cat.main;
              let petalsSvg = '';
              for (let p = 0; p < petals; p++) {
                const angle = (360 / petals) * p + layer * 15;
                const prx = layerSize * 0.35;
                const pry = layerSize * 0.55;
                petalsSvg += `<ellipse cx="${cx + Math.cos(angle * Math.PI / 180) * layerSize * 0.2}" cy="${cy + Math.sin(angle * Math.PI / 180) * layerSize * 0.2}" rx="${prx}" ry="${pry}" fill="${layerColor}" opacity="${layerOpacity}" transform="rotate(${angle},${cx},${cy})" filter="url(#wcEdge${fid})"/>`;
              }
              svg += petalsSvg;
            }
            // 花心
            svg += `<circle cx="${cx}" cy="${cy}" r="${size * 0.1}" fill="${cat.detail}" opacity="0.3"/>`;
          } else if (style === 'jasmine') {
            // 茉莉：5 瓣星形花 + 黄色花心
            for (let p = 0; p < 5; p++) {
              const angle = (72) * p - 90;
              const rad = angle * Math.PI / 180;
              svg += `<path d="${_petalPath(size * 0.25, size * 0.55)}" fill="${cat.main}" opacity="0.3" transform="translate(${cx},${cy}) rotate(${angle})" filter="url(#wcEdge${fid})"/>`;
            }
            svg += `<circle cx="${cx}" cy="${cy}" r="${size * 0.12}" fill="#E8D060" opacity="0.4" filter="url(#wcSoft${fid})"/>`;
          } else {
            // 通用花：5-6 片柔和椭圆花瓣
            const petals = petalCount || (5 + Math.floor(rng() * 2));
            // 浅色底层洗
            for (let p = 0; p < petals; p++) {
              const angle = (360 / petals) * p + rng() * 10;
              svg += `<ellipse cx="${cx}" cy="${cy}" rx="${size * 0.35}" ry="${size * 0.55}" fill="${cat.wash2}" opacity="0.2" transform="translate(${Math.cos(angle * Math.PI / 180) * size * 0.25},${Math.sin(angle * Math.PI / 180) * size * 0.25}) rotate(${angle},${cx},${cy})" filter="url(#wcEdge${fid})"/>`;
            }
            // 主色花瓣
            for (let p = 0; p < petals; p++) {
              const angle = (360 / petals) * p + rng() * 8;
              const px = cx + Math.cos(angle * Math.PI / 180) * size * 0.22;
              const py = cy + Math.sin(angle * Math.PI / 180) * size * 0.22;
              svg += `<ellipse cx="${px}" cy="${py}" rx="${size * 0.28}" ry="${size * 0.48}" fill="${cat.main}" opacity="0.28" transform="rotate(${angle},${px},${py})" filter="url(#wcEdge${fid})"/>`;
            }
            // 花心
            svg += `<circle cx="${cx}" cy="${cy}" r="${size * 0.1}" fill="${cat.detail}" opacity="0.35" filter="url(#wcSoft${fid})"/>`;
          }
          return svg;
        }

        // 柑橘/水果/水生/绿叶的植物元素
        function drawCitrusFruit(cx, cy, size) {
          let svg = '';
          // 柑橘横切面
          const outerR = size;
          svg += `<circle cx="${cx}" cy="${cy}" r="${outerR}" fill="${cat.main}" opacity="0.3" filter="url(#wcEdge${fid})"/>`;
          svg += `<circle cx="${cx}" cy="${cy}" r="${outerR * 0.85}" fill="#FFF8E0" opacity="0.4" filter="url(#wcSoft${fid})"/>`;
          // 果瓣线
          const segs = 8;
          for (let i = 0; i < segs; i++) {
            const a = (360 / segs) * i;
            const rad = a * Math.PI / 180;
            svg += `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(rad) * outerR * 0.8}" y2="${cy + Math.sin(rad) * outerR * 0.8}" stroke="${cat.main}" stroke-width="0.8" opacity="0.18" filter="url(#wcSoft${fid})"/>`;
          }
          // 中心点
          svg += `<circle cx="${cx}" cy="${cy}" r="${outerR * 0.1}" fill="${cat.detail}" opacity="0.25"/>`;
          // 旁边一片叶子
          svg += `<path d="${_leafPath(size * 0.4, size * 0.9, 0.55)}" fill="${cat.leaf}" opacity="0.28" transform="translate(${cx + size + 5},${cy - size * 0.3}) rotate(${35 + rng() * 15})" filter="url(#wcEdge${fid})"/>`;
          return svg;
        }

        function drawPeach(cx, cy, size) {
          let svg = '';
          // 桃子形状
          svg += `<path d="M${cx},${cy - size * 0.8} Q${cx + size * 0.9},${cy - size * 0.6} ${cx + size * 0.7},${cy + size * 0.1} Q${cx + size * 0.4},${cy + size * 0.8} ${cx},${cy + size * 0.7} Q${cx - size * 0.4},${cy + size * 0.8} ${cx - size * 0.7},${cy + size * 0.1} Q${cx - size * 0.9},${cy - size * 0.6} ${cx},${cy - size * 0.8}Z" fill="${cat.main}" opacity="0.28" filter="url(#wcEdge${fid})"/>`;
          // 桃子沟
          svg += `<path d="M${cx},${cy - size * 0.6} Q${cx + 2},${cy} ${cx},${cy + size * 0.5}" fill="none" stroke="${cat.detail}" stroke-width="0.8" opacity="0.18" filter="url(#wcSoft${fid})"/>`;
          // 高光
          svg += `<ellipse cx="${cx - size * 0.2}" cy="${cy - size * 0.2}" rx="${size * 0.2}" ry="${size * 0.15}" fill="white" opacity="0.15" filter="url(#wcSoft${fid})"/>`;
          // 小叶子
          svg += `<path d="${_leafPath(size * 0.25, size * 0.5, 0.5)}" fill="${cat.leaf}" opacity="0.25" transform="translate(${cx + 3},${cy - size * 0.9}) rotate(${10 + rng() * 20})" filter="url(#wcEdge${fid})"/>`;
          return svg;
        }

        function drawGrassLeaves(cx, cy, size) {
          let svg = '';
          const count = 4 + Math.floor(rng() * 4);
          for (let i = 0; i < count; i++) {
            const baseX = cx - size + rng() * size * 2;
            const tipX = baseX + (rng() - 0.5) * 20;
            const tipY = cy - size * (1.5 + rng() * 1.5);
            const cpX = (baseX + tipX) / 2 + (rng() - 0.5) * 15;
            const cpY = (cy + tipY) / 2;
            svg += `<path d="M${baseX},${cy} Q${cpX},${cpY} ${tipX},${tipY}" fill="none" stroke="${cat.main}" stroke-width="${1 + rng() * 1.5}" opacity="${(0.2 + rng() * 0.15).toFixed(2)}" stroke-linecap="round" filter="url(#wcSoft${fid})"/>`;
          }
          return svg;
        }

        function drawWaves(cx, cy, size) {
          let svg = '';
          // 3 条波浪线
          for (let w = 0; w < 3; w++) {
            const y = cy - size + w * size * 0.8;
            const amp = size * (0.15 + rng() * 0.15);
            let d = `M${cx - size * 1.5},${y}`;
            for (let x = 0; x <= 3; x++) {
              d += ` Q${cx - size * 1.5 + size * (x + 0.5)},${y + amp * (x % 2 === 0 ? 1 : -1)} ${cx - size * 1.5 + size * (x + 1)},${y}`;
            }
            svg += `<path d="${d}" fill="none" stroke="${cat.main}" stroke-width="${1.5 - w * 0.3}" opacity="${(0.2 - w * 0.04).toFixed(2)}" stroke-linecap="round" filter="url(#wcSoft${fid})"/>`;
          }
          // 气泡
          for (let i = 0; i < 3; i++) {
            const bx = cx + (rng() - 0.5) * size * 2;
            const by = cy + (rng() - 0.5) * size;
            const br = 2 + rng() * 5;
            svg += `<circle cx="${bx}" cy="${by}" r="${br}" fill="none" stroke="${cat.main}" stroke-width="0.8" opacity="0.15"/>`;
            svg += `<circle cx="${bx - br * 0.25}" cy="${by - br * 0.25}" r="${br * 0.2}" fill="white" opacity="0.2"/>`;
          }
          return svg;
        }

        function drawBranch(cx, cy, size) {
          let svg = '';
          // 优雅的树枝段
          const endX = cx + size * 1.5 + rng() * size;
          const endY = cy - size * 0.3 + rng() * size * 0.6;
          const cpX = (cx + endX) / 2 + (rng() - 0.5) * 20;
          const cpY = cy - 15 - rng() * 25;
          svg += `<path d="M${cx},${cy} Q${cpX},${cpY} ${endX},${endY}" fill="none" stroke="${cat.detail}" stroke-width="1.8" opacity="0.25" stroke-linecap="round" filter="url(#wcSoft${fid})"/>`;
          // 小枝分叉
          const branchPt = 0.4 + rng() * 0.3;
          const bpx = cx + (endX - cx) * branchPt;
          const bpy = cy + (endY - cy) * branchPt;
          svg += `<path d="M${bpx},${bpy} Q${bpx + 12},${bpy - 18} ${bpx + 8 + rng() * 10},${bpy - 25 - rng() * 10}" fill="none" stroke="${cat.detail}" stroke-width="1" opacity="0.18" stroke-linecap="round"/>`;
          // 2-3 片小叶子
          for (let i = 0; i < 2 + Math.floor(rng() * 2); i++) {
            const lx = cx + (endX - cx) * (0.3 + rng() * 0.5);
            const ly = cy + (endY - cy) * (0.3 + rng() * 0.5);
            const lSize = size * (0.25 + rng() * 0.2);
            const lRot = -30 + rng() * 60;
            svg += `<path d="${_leafPath(lSize * 0.4, lSize, 0.5)}" fill="${cat.leaf}" opacity="0.25" transform="translate(${lx},${ly}) rotate(${lRot})" filter="url(#wcEdge${fid})"/>`;
          }
          // 小芽苞
          if (rng() > 0.4) {
            const budX = endX;
            const budY = endY;
            svg += `<ellipse cx="${budX}" cy="${budY}" rx="${size * 0.08}" ry="${size * 0.15}" fill="${cat.main}" opacity="0.25" filter="url(#wcEdge${fid})"/>`;
          }
          return svg;
        }

        function drawBottle(cx, cy, size) {
          let svg = '';
          // 简约香水瓶轮廓
          const bw = size * 0.7, bh = size * 1.2;
          const neckW = size * 0.2, neckH = size * 0.35;
          // 瓶身
          svg += `<path d="M${cx - bw / 2},${cy - bh / 2 + neckH} Q${cx - bw / 2 - 3},${cy} ${cx - bw / 2},${cy + bh / 2} L${cx + bw / 2},${cy + bh / 2} Q${cx + bw / 2 + 3},${cy} ${cx + bw / 2},${cy - bh / 2 + neckH} Z" fill="${cat.main}" opacity="0.15" filter="url(#wcEdge${fid})"/>`;
          // 瓶颈
          svg += `<rect x="${cx - neckW / 2}" y="${cy - bh / 2}" width="${neckW}" height="${neckH}" rx="2" fill="${cat.main}" opacity="0.18" filter="url(#wcEdge${fid})"/>`;
          // 高光
          svg += `<line x1="${cx - bw * 0.15}" y1="${cy - bh * 0.1}" x2="${cx - bw * 0.15}" y2="${cy + bh * 0.25}" stroke="white" stroke-width="1.5" opacity="0.12" stroke-linecap="round"/>`;
          // 小植物点缀
          svg += `<path d="${_leafPath(size * 0.2, size * 0.35, 0.45)}" fill="${cat.leaf}" opacity="0.2" transform="translate(${cx + bw * 0.4},${cy - bh * 0.2}) rotate(${20 + rng() * 15})" filter="url(#wcEdge${fid})"/>`;
          return svg;
        }

        // 根据分类选择主插画
        if (isFloral) {
          const scentId = primary ? primary.id : '';
          const style = scentId === 'rose' ? 'rose' : scentId === 'jasmine' ? 'jasmine' : 'generic';
          const fcx = 60 + rng() * 80, fcy = 30 + rng() * 30, fsize = 18 + rng() * 14;
          mainArt += drawFlower(fcx, fcy, fsize, 0, style);
          // 可选第二朵小花
          if (rng() > 0.5) {
            const fcx2 = fcx + 60 + rng() * 80, fcy2 = fcy + 15 + rng() * 25, fsize2 = 10 + rng() * 8;
            mainArt += drawFlower(fcx2, fcy2, fsize2, 0, 'generic');
          }
        } else if (category === 'citrus') {
          const fcx = 70 + rng() * 60, fcy = H * 0.45 + (rng() - 0.5) * 20, fsize = 22 + rng() * 12;
          mainArt += drawCitrusFruit(fcx, fcy, fsize);
        } else if (category === 'fruity') {
          const fcx = 70 + rng() * 60, fcy = H * 0.45 + (rng() - 0.5) * 15, fsize = 22 + rng() * 10;
          mainArt += drawPeach(fcx, fcy, fsize);
        } else if (isLeafy) {
          const fcx = 80 + rng() * 60, fcy = H * 0.55, fsize = 30 + rng() * 15;
          mainArt += drawGrassLeaves(fcx, fcy, fsize);
        } else if (isAquatic) {
          const fcx = W * 0.4, fcy = H * 0.5, fsize = 30 + rng() * 10;
          mainArt += drawWaves(fcx, fcy, fsize);
        } else if (isWoody) {
          // 随机选择树枝或香水瓶
          if (rng() > 0.45) {
            const fcx = 40 + rng() * 60, fcy = H * 0.45 + (rng() - 0.5) * 20, fsize = 20 + rng() * 12;
            mainArt += drawBranch(fcx, fcy, fsize);
          } else {
            const fcx = 80 + rng() * 60, fcy = H * 0.48, fsize = 22 + rng() * 10;
            mainArt += drawBottle(fcx, fcy, fsize);
          }
          // 额外的小叶子点缀
          const lc = 1 + Math.floor(rng() * 3);
          for (let i = 0; i < lc; i++) {
            const lx = 250 + rng() * 120, ly = 20 + rng() * (H - 40);
            const ls = 8 + rng() * 10;
            mainArt += `<path d="${_leafPath(ls * 0.4, ls, 0.5)}" fill="${cat.leaf}" opacity="${(0.12 + rng() * 0.1).toFixed(2)}" transform="translate(${lx},${ly}) rotate(${-40 + rng() * 80})" filter="url(#wcEdge${fid})"/>`;
          }
        }

        // ====== 3. 次要装饰元素 ======
        let accentArt = '';
        // 小花苞/小叶子/圆点
        const accentCount = 2 + Math.floor(rng() * 3);
        for (let i = 0; i < accentCount; i++) {
          const ax = 200 + rng() * (W - 220);
          const ay = 15 + rng() * (H - 30);
          const aType = rng();
          if (aType < 0.4) {
            // 小叶子
            const ls = 5 + rng() * 8;
            accentArt += `<path d="${_leafPath(ls * 0.4, ls, 0.5)}" fill="${cat.leaf}" opacity="${(0.15 + rng() * 0.12).toFixed(2)}" transform="translate(${ax},${ay}) rotate(${-30 + rng() * 60})" filter="url(#wcEdge${fid})"/>`;
          } else if (aType < 0.7) {
            // 小花苞
            const bs = 3 + rng() * 5;
            accentArt += `<ellipse cx="${ax}" cy="${ay}" rx="${bs * 0.5}" ry="${bs}" fill="${cat.main}" opacity="${(0.12 + rng() * 0.1).toFixed(2)}" filter="url(#wcEdge${fid})"/>`;
          } else {
            // 小圆点
            const ds = 2 + rng() * 4;
            accentArt += `<circle cx="${ax}" cy="${ay}" r="${ds}" fill="${cat.main}" opacity="${(0.1 + rng() * 0.12).toFixed(2)}" filter="url(#wcSoft${fid})"/>`;
          }
        }

        // 小蝴蝶剪影
        const bfx = 250 + rng() * 120, bfy = 20 + rng() * 40;
        const bfRot = -20 + rng() * 40;
        accentArt += `<g transform="translate(${bfx},${bfy}) rotate(${bfRot}) scale(${0.5 + rng() * 0.4})" opacity="0.10" filter="url(#wcSoft${fid})">
          <path d="M0,0 C-3,-6 -10,-10 -14,-6 C-12,-3 -6,-1 -2,1 C-4,3 -10,8 -12,12 C-8,9 -3,5 0,3 C3,5 8,9 12,12 C10,8 4,3 2,1 C6,-1 12,-3 14,-6 C10,-10 3,-6 0,0Z" fill="${cat.detail}"/>
        </g>`;

        // 飘落花瓣（2-3 片）
        for (let i = 0; i < 2 + Math.floor(rng() * 2); i++) {
          const px = 180 + rng() * (W - 200);
          const py = 10 + rng() * (H - 20);
          const ps = 4 + rng() * 6;
          const pRot = rng() * 360;
          accentArt += `<ellipse cx="${px}" cy="${py}" rx="${ps * 0.4}" ry="${ps}" fill="${cat.main}" opacity="${(0.08 + rng() * 0.08).toFixed(2)}" transform="rotate(${pRot},${px},${py})" filter="url(#wcSoft${fid})"/>`;
        }

        // ====== 4. 麻雀剪影 ======
        const spx = W * 0.8 + rng() * W * 0.12, spy = 10 + rng() * 22, sps = 0.28 + rng() * 0.2;
        const sparrowArt = `<g transform="translate(${spx},${spy}) scale(${sps})" opacity="0.08" filter="url(#wcSoft${fid})">
          <path d="M0,0 C-4,-8 -16,-10 -22,-6 C-18,-4 -10,-2 -4,2 C-8,4 -16,8 -20,14 C-14,10 -6,6 0,4 C2,6 6,10 10,8 C8,6 4,4 2,2 C6,0 10,-2 12,-6 C8,-4 4,-2 0,0Z" fill="${cat.detail}"/>
        </g>`;

        // ====== 5. 英文名水印 ======
        let watermarkArt = '';
        scents.forEach((s, i) => {
          const wx = W - 12, wy = H - 12 - i * 14;
          const wOpacity = (0.06 + rng() * 0.02).toFixed(2);
          watermarkArt += `<text x="${wx}" y="${wy}" text-anchor="end" font-family="'Noto Serif SC','Georgia',serif" font-size="11" fill="${cat.detail}" opacity="${wOpacity}" font-style="italic">${s.englishName}</text>`;
        });

        // ====== 组装 SVG ======
        const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" height="140" style="display:block;border-radius:10px;border:1px solid var(--border-color);margin-bottom:10px;">
      ${filterDef}
      <!-- 底色 -->
      ${bgElements}
      <!-- 主插画 -->
      ${mainArt}
      <!-- 装饰元素 -->
      ${accentArt}
      <!-- 麻雀 -->
      ${sparrowArt}
      <!-- 水印文字 -->
      ${watermarkArt}
    </svg>`;

        return svgString;
      }

      const renderWelcome = () => (
        <div className="page welcome-page">
          <div className="welcome-logo-wrap">
            <img src={LOGO_SRC} alt="小雀" />
          </div>
          <div className="welcome-title">闻见彼此</div>
          <div className="welcome-en">Smell &middot; Understand &middot; Create</div>
          <p className="welcome-desc">
            用一句话描述你的心情<br/>
            AI 为你生成独一无二的调香方案<br/>
            前调 · 中调 · 后调<br/>
            完整配方，一目了然
          </p>
          <button className="btn btn-primary btn-large" onClick={goNext} style={{maxWidth:'320px'}}>
            开始调香
          </button>
          <p className="welcome-footer">
            AI 调香 × 雀亦锵锵<br/>
            雀亦虽小，齐鸣如凤
          </p>
        </div>
      );

      const renderInput = () => {
        const handleSubmit = () => {
          const v = document.getElementById('wish-input').value;
          if (!v.trim()) { document.getElementById('wish-error').style.display='block'; return; }
          document.getElementById('wish-error').style.display='none';
          updateState({customerWish:v.trim()}); goNext();
        };
        return (
          <div className="page input-page">
            <div className="page-header" style={{marginBottom:24}}>
              <h2 className="page-title">你想要一瓶<br/>什么样的香水？</h2>
              <p className="page-subtitle">用一句话描述心情、场景或感觉</p>
            </div>
            <div className="input-area" style={{marginBottom:16}}>
              <textarea id="wish-input" className="input" rows={4} placeholder="例如：我想要一瓶送给刚毕业朋友的香水，希望它有新的开始的感觉，但不要太甜。" />
              <p id="wish-error" style={{color:'#C0392B',fontSize:13,marginTop:6,display:'none'}}>请先写下你的香气愿望</p>
            </div>
            <div className="hint-card">
              <p className="hint-card-title">可以这样描述</p>
              <ul style={{paddingLeft:18,listStyle:'disc'}}>
                <li>心情："最近压力很大，想要放松安静的"</li>
                <li>场景："夏天海边度假的感觉，清新自然"</li>
                <li>对象："送给女朋友的生日礼物，浪漫温柔"</li>
                <li>风格："不要甜，要干净极简的木质香"</li>
              </ul>
            </div>
            <div className="page-footer">
              <button className="btn btn-yellow btn-large" onClick={handleSubmit}>生成我的调香方案</button>
            </div>
          </div>
        );
      };

      const renderLoading = () => (
        <div className="page loading-page">
          <div className="loading-bird"><img src={LOGO_SRC} alt="" /></div>
          <p className="loading-text">AI 正在为你调香</p>
          <p className="loading-sub">解析愿望 · 匹配香气 · 生成配方</p>
          <div className="loading-spinner-bar"></div>
        </div>
      );

      const renderResult = () => {
        const s = state.storyCard;
        if (!s) return null;
        const handleCopy = () => {
          const t = `${s.title}\n${s.coCreators}\n\n${s.keywords.join('、')}\n\n前调：\n${s.formulaByNote.top.join('\n')}\n\n中调：\n${s.formulaByNote.middle.join('\n')}\n\n后调：\n${s.formulaByNote.base.join('\n')}\n\n${s.diluentText}\n\n${s.story}\n\n${s.understandingLine}`.trim();
          navigator.clipboard?.writeText(t).then(()=>alert('已复制调香方案'));
        };
        const handleDownload = () => {
          const el = document.getElementById('story-card-content');
          if(!el) return;
          html2canvas(el, {scale:2,backgroundColor:'#F5F0E1',useCORS:true}).then(c=>{const a=document.createElement('a');a.download=`${s.title||'调香方案'}.png`;a.href=c.toDataURL('image/png');a.click();}).catch(()=>alert('图片生成失败，请尝试截屏'));
        };
        return (
          <div className="page result-page">
            <button className="result-back-btn" onClick={goToStart}>← 再调一瓶</button>
            <div className="page-header" style={{marginBottom:20,textAlign:'left'}}>
              <h2 className="page-title" style={{fontSize:22}}>你的专属调香方案</h2>
            </div>

            <div id="story-card-content" className="story-card">
              <div className="story-card-bg" style={{backgroundImage:`url(${BG_SRC})`}}></div>
              <div className="story-card-overlay"></div>
              <div className="story-card-content">
                <div className="story-card-seal">和心青年一起闻见彼此</div>
                <div className="story-card-title">{s.title}</div>
                <div className="story-card-creators">{s.coCreators}</div>
                <div style={{display:'flex',flexWrap:'wrap',justifyContent:'center',marginBottom:4}}>
                  {s.keywords.map(f => <span key={f} className="tag">{f}</span>)}
                </div>

                <div className="story-formula">
                  <div className="formula-note-label">前 调</div>
                  {s.formulaByNote.top.map((item,i) => { const n=item.split('：')[0]; return <div key={i} className="formula-row"><img className="formula-row-icon" src={`${SCENT_IMG_BASE}${getScentId(n)}.jpg`} alt={n} /><span className="formula-row-name">{n}</span><span className="formula-row-drops">{item.split('：')[1]}</span></div>; })}
                  <div className="formula-note-label" style={{marginTop:12}}>中 调</div>
                  {s.formulaByNote.middle.map((item,i) => { const n=item.split('：')[0]; return <div key={i} className="formula-row"><img className="formula-row-icon" src={`${SCENT_IMG_BASE}${getScentId(n)}.jpg`} alt={n} /><span className="formula-row-name">{n}</span><span className="formula-row-drops">{item.split('：')[1]}</span></div>; })}
                  <div className="formula-note-label" style={{marginTop:12}}>后 调</div>
                  {s.formulaByNote.base.map((item,i) => { const n=item.split('：')[0]; return <div key={i} className="formula-row"><img className="formula-row-icon" src={`${SCENT_IMG_BASE}${getScentId(n)}.jpg`} alt={n} /><span className="formula-row-name">{n}</span><span className="formula-row-drops">{item.split('：')[1]}</span></div>; })}
                </div>

                <div className="formula-divider"></div>
                <p className="story-drops-total">香精总量 <strong>{s.totalDrops}</strong> 滴</p>
                <p className="story-diluent">最后请心青年加入稀释液完成制作</p>

                <div className="story-text-block">
                  <p className="story-text">{s.story}</p>
                  <p className="story-underline">{s.understandingLine}</p>
                </div>
              </div>
            </div>

            <div className="result-footer">
              <button className="btn btn-primary btn-large" onClick={handleDownload} style={{marginBottom:10}}>保存为图片</button>
              <button className="btn btn-outline" onClick={handleCopy}>复制方案文字</button>
            </div>
          </div>
        );
      };

      const renderers = { welcome:renderWelcome, input:renderInput, loading:renderLoading, result:renderResult };
      return renderers[STEPS[step]] ? renderers[STEPS[step]]() : null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
